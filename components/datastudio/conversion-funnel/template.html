<article class="fv-card fv-funnel-card"><header class="fv-head"><div><h2>Funil de conversão</h2><p>{{lookup (lookup fields.metrics 0) "name"}}</p></div></header><main class="fv-funnel">{{#each data.DEFAULT}}<div class="fv-step" style="width:{{multiply (divide (lookup metrics 0) (lookup (lookup (lookup (lookup (lookup @root "data") "DEFAULT") 0) "metrics") 0)) 100}}%"><span>{{lookup dimensions 0}}</span><b>{{localeString (divide (round (multiply (lookup metrics 0) 100)) 100) "pt-BR"}}</b></div>{{else}}<div class="fv-empty">Nenhum dado encontrado</div>{{/each}}</main></article>
