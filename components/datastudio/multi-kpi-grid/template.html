{{#each data.DEFAULT}}<article class="fv-card"><header class="fv-head"><div><h2>Visão executiva</h2><p>Indicadores principais</p></div><span class="fv-badge">4 KPIs</span></header><div class="fv-grid">{{#each metrics}}<div class="fv-tile"><span class="fv-label">{{lookup (lookup @root.fields.metrics @index) "name"}}</span><b>{{localeString (divide (round (multiply this 100)) 100) "pt-BR"}}</b></div>{{/each}}</div></article>{{else}}<div class="fv-empty">Nenhum dado encontrado</div>{{/each}}
