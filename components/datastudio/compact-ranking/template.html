<input class="fv-radio" type="radio" name="fv-limit" id="fv-5" checked><input class="fv-radio" type="radio" name="fv-limit" id="fv-10"><input class="fv-radio" type="radio" name="fv-limit" id="fv-all"><article class="fv-card fv-ranking"><header class="fv-head"><div><h2>Ranking compacto</h2><p>{{lookup (lookup fields.dimensions 0) "name"}}</p></div><details><summary>Top N</summary><div><label for="fv-5">Top 5</label><label for="fv-10">Top 10</label><label for="fv-all">Todos</label></div></details></header><main class="fv-list">{{#each data.DEFAULT}}<div class="fv-row"><span>{{add @index 1}}. {{lookup dimensions 0}}</span><b>{{localeString (divide (round (multiply (lookup metrics 0) 100)) 100) "pt-BR"}}</b><div class="fv-mini-track"><i style="width:{{multiply (divide (lookup metrics 0) (lookup (lookup (lookup (lookup (lookup @root "data") "DEFAULT") 0) "metrics") 0)) 100}}%"></i></div></div>{{else}}<div class="fv-empty">Nenhum dado encontrado</div>{{/each}}</main></article>
